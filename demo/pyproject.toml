[project]
name = "nature-ai-demo"
version = "0.1.0"
description = "Nature AI - vLLM + FastAPI + Langchain 演示项目"
authors = [{name = "Nature AI Team"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "langchain==0.1.0",
    "langchain-community==0.0.10",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "httpx==0.25.2",
    "aiohttp==3.9.1",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
